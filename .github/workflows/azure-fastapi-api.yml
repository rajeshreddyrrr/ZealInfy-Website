name: Deploy ZealInfy FastAPI API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/azure-fastapi-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy FastAPI to Azure App Service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate API
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall main.py

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FASTAPI_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FASTAPI_PUBLISH_PROFILE }}
          package: api

      - name: Configure FastAPI startup command
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_FASTAPI_APP_NAME }}
          slot-name: Production
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true",
                "slotSetting": false
              }
            ]
          general-settings-json: |
            {
              "linuxFxVersion": "PYTHON|3.11"
            }
